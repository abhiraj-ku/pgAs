name: CI Test with DB Branching

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: template_db
        options: >-
          --health-cmd "pg_isready -U root -d template_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -c file_copy_method=clone
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Git Branch Name
        id: vars
        shell: bash
        run: |
          # Cleans the branch name (e.g. feature/auth -> feature_auth) for a safe SQL identifier
          CLEAN_BRANCH=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9_]/_/g')
          echo "db_branch=$CLEAN_BRANCH" >> $GITHUB_OUTPUT

      - name: Seed Template Database
        run: |
          # Install postgres client tools on the runner
          sudo apt-get update && sudo apt-get install -y postgresql-client
          
          # Seed your production schema / baseline testing data into the template
          PGPASSWORD=rootpassword psql -h localhost -U root -d template_db -c "
            CREATE TABLE users (id SERIAL PRIMARY KEY, name VARCHAR(50));
            INSERT INTO users (name) VALUES ('Seed User Alice'), ('Seed User Bob');
          "

      - name: Instant COW Database Branching
        run: |
          # 1. Terminate potential hanging connections to the template
          PGPASSWORD=rootpassword psql -h localhost -U root -d template_db -c "
            SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'template_db';"
          
          # 2. Fire up the instant copy-on-write database branch
          PGPASSWORD=rootpassword psql -h localhost -U root -d template_db -c "
            CREATE DATABASE db_${{ steps.vars.outputs.db_branch }} 
            WITH TEMPLATE template_db STRATEGY = FILE_COPY;"

      - name: Run Application Tests Against The Branch
        env:
          # Point test suite connection string directly to the new isolated branch
          DATABASE_URL: postgres://root:rootpassword@localhost:5432/db_${{ steps.vars.outputs.db_branch }}
        run: |
          echo "Connecting test harness to $DATABASE_URL"
          # Run npm test, pytest, cargo test, etc.
